<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrispyDepression – Paperback 0.8 Repo</title>
<style>
  :root { color-scheme: dark light; --bg:#14161c; --fg:#eceef3; --mut:#9aa0ad; --card:#1d2029; --acc:#ff7a45; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#15171c; --mut:#5d6472; --card:#fff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,system-ui,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:32px 20px 60px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--mut); }
  .btn { display:block; text-align:center; background:var(--acc); color:#fff; text-decoration:none; font-weight:700;
         padding:16px; border-radius:14px; font-size:18px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-top:16px; }
  code { display:block; word-break:break-all; font-size:14px; margin:8px 0; user-select:all; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:600; }
  .src { display:flex; align-items:center; gap:12px; padding:8px 0; }
  .src img { width:44px; height:44px; border-radius:10px; }
  .src small { color:var(--mut); display:block; }
  #status { font-size:14px; }
  .ok { color:#3cc46b; } .bad { color:#ff5a5a; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 6px; }
</style>
</head>
<body>
<main>
  <h1>CrispyDepression</h1>
  <p class="sub">Paperback 0.8 source repository</p>

  <a id="add" class="btn" href="#">Add to Paperback</a>
  <p style="color:var(--mut);font-size:14px;text-align:center">Open this page in Safari on the iPhone that has Paperback installed.</p>

  <div class="card">
    <h2>Or add it manually</h2>
    <code id="url"></code>
    <button id="copy">Copy URL</button>
    <p style="color:var(--mut);font-size:14px;margin:10px 0 0">Paperback → Settings → External Sources → Add Repository.</p>
  </div>

  <div class="card">
    <h2>Repo check</h2>
    <div id="status">Checking…</div>
    <div id="sources"></div>
  </div>
</main>
<script>
  // Works on whatever URL this page is hosted at.
  var base = location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '').replace(/\/$/, '');
  document.getElementById('url').textContent = base;
  document.getElementById('add').href =
    'paperback://addRepo?displayName=' + encodeURIComponent('CrispyDepression') + '&url=' + encodeURIComponent(base);

  document.getElementById('copy').onclick = function () {
    var done = function () { document.getElementById('copy').textContent = 'Copied'; };
    if (navigator.clipboard) navigator.clipboard.writeText(base).then(done, done); else done();
  };

  fetch(base + '/versioning.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (v) {
      if (!v.buildTime || !Array.isArray(v.sources)) throw new Error('versioning.json is missing buildTime/sources');
      document.getElementById('status').innerHTML = '<span class="ok">✓ versioning.json found and valid</span>';
      document.getElementById('sources').innerHTML = v.sources.map(function (s) {
        return '<div class="src"><img src="' + base + '/' + s.id + '/includes/' + s.icon + '" alt="">' +
               '<div><b>' + s.name + '</b> <small>v' + s.version + '</small></div></div>';
      }).join('');
    })
    .catch(function (e) {
      document.getElementById('status').innerHTML =
        '<span class="bad">✗ Could not read ' + base + '/versioning.json (' + e.message + ')</span>';
    });
</script>
</body>
</html>
